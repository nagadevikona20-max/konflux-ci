apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Inherit shared base resources from tekton-chains-rbac
resources:
  - ../tekton-chains-rbac/base

# Transform all namespaces to openshift-pipelines
namespace: openshift-pipelines

patches:
  # Fix RoleBinding subjects to reference SA in openshift-pipelines (not tekton-pipelines)
  - target:
      kind: RoleBinding
      name: chains-secret-admin
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: openshift-pipelines
images:
  - name: quay.io/konflux-ci/appstudio-utils
    digest: sha256:909bce0cb502caa2ff5704cfce7eb4435ec75769e6f88d2dc3ffcda8c14f4209

  # Set TARGET_NAMESPACE for OCP and apply stricter security context
  - target:
      kind: Job
      name: tekton-chains-signing-secret
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "openshift-pipelines"
      - op: replace
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
